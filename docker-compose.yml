services:
  # PostgreSQL database service
  postgres-db:
    # Use the lightweight Alpine Linux version of Postgres 15
    image: postgres:15-alpine
    container_name: little-delhi-db
    environment:
      # Automatically creates a database named 'littledelhi' on startup
      - POSTGRES_DB=littledelhi
      # The default superuser for Postgres
      - POSTGRES_USER=postgres
      # The password required to connect to the database
      - POSTGRES_PASSWORD=password123
    ports:
      # Map the container's port 5432 to your computer's port 5432
      # Format is: [HOST_PORT]:[CONTAINER_PORT]
      - "5432:5432"
    volumes:
      # Mounts the 'postgres_data' volume so your data persists
      # even if you delete the container
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Spring Boot application service
  app:
    build: .
    container_name: little-delhi-app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/littledelhi
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password123
    depends_on:
      - postgres-db
    restart: always

# Named volume to ensure our database info isn't lost when we stop the container
volumes:
  postgres_data:
